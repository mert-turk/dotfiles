# ─────────────────────────────────────
# General
# ─────────────────────────────────────

set -g mouse on
set -g history-limit 10000

# 1-based window indexing
set -g base-index 1
setw -g pane-base-index 1

# Faster command response
set -s escape-time 0

# ─────────────────────────────────────
# Tokyo Night Status Bar
# ─────────────────────────────────────

set -g status on
set -g status-position bottom
set -g status-interval 2

# Overall status bar
set -g status-style "bg=#16161e,fg=#a9b1d6"

# Left side
set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7,bold] 󰕈 #[fg=#c0caf5]#S "

# Window list
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#16161e,bg=#7aa2f7,bold] #I:#W "

# Right side
set -g status-right-length 60
set -g status-right "#[fg=#7dcfff] %H:%M #[fg=#565f89]│ #[fg=#bb9af7]tmux "

# Separators
set -g window-status-separator " "

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
